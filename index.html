<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 디자인 규칙은 같은 폴더의 DESIGN.md 에 있다. 색·글꼴·간격은 아래 토큰만 바꾸면 페이지 전체에 적용된다. */
  :root{
    color-scheme:light;
    --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F4F4F5; --border:#D4D4D8; --control-border:#85858F;
    --text:#18181B; --muted:#62626B;
    --accent:#1D4ED8; --accent-hover:#1E40AF; --accent-soft:#EFF6FF; --on-accent:#FFFFFF;
    --shadow:none;
    --font-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono","IBM Plex Sans KR",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#111113; --surface:#18181B; --surface2:#242427; --border:#3F3F46; --control-border:#71717A;
      --text:#F4F4F5; --muted:#A1A1AA;
      --accent:#93C5FD; --accent-hover:#BFDBFE; --accent-soft:#172554; --on-accent:#111113;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#111113; --surface:#18181B; --surface2:#242427; --border:#3F3F46; --control-border:#71717A;
    --text:#F4F4F5; --muted:#A1A1AA;
    --accent:#93C5FD; --accent-hover:#BFDBFE; --accent-soft:#172554; --on-accent:#111113;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.75;
    word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 96px}

  /* 머리: 이름·직무 → 기록 범위 → 전문성 → 성과 → 연락처 */
  header{padding-bottom:24px;border-bottom:1px solid var(--border)}
  h1{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.3;margin:0;text-wrap:balance}
  .sub{color:var(--muted);font-size:15px;margin:6px 0 0;max-width:60ch}
  .hero{margin-top:20px}
  .hero-tag{font-size:20px;font-weight:500;line-height:1.6;letter-spacing:-.01em;margin:0;max-width:44rem;text-wrap:balance}
  .hero-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:20px;max-width:44rem}
  .metric{padding:12px 16px;background:var(--surface2);border-radius:8px}
  .metric .v{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
  .metric .l{font-size:14px;font-weight:500;margin-top:2px}
  .metric .n{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.6}
  .hero-foot{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .hero-foot a{font-weight:500;text-decoration:none}
  .hero-foot a:hover{text-decoration:underline}

  /* 모드, 검색, 필터 */
  .modes{display:flex;gap:4px;margin:24px 0 16px;border-bottom:1px solid var(--border)}
  .mode{min-height:44px;padding:8px 14px;font-size:15px;cursor:pointer;background:none;border:none;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .mode[aria-pressed="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
  /* 학력·자격·교육·수상 목록. 프로젝트 카드로 만들면 목록이 과밀해져 따로 둔다. */
  .creds{display:flex;flex-direction:column;gap:40px}
  .creds h3{font-size:18px;font-weight:600;line-height:1.5;letter-spacing:-.01em;margin:0 0 12px}
  .creds h3 span{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
  .cred-note{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 24px;max-width:44rem}
  .cred-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
  .cred-list li{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;
    padding:12px 0;border-bottom:1px solid var(--border)}
  .cred-name{font-size:15px;font-weight:500;flex:1 1 18rem;min-width:0}
  .cred-org{font-size:13px;color:var(--muted);flex:0 1 auto}
  .cred-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin-left:auto;white-space:nowrap}
  .cred-detail{flex:1 1 100%;font-size:13px;line-height:1.6;color:var(--muted)}
  .cred-name a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .cred-more{min-height:44px;margin-top:8px;padding:8px 14px;font-size:14px;font-weight:500;
    cursor:pointer;background:var(--surface);color:var(--text);
    border:1px solid var(--control-border);border-radius:6px}
  .cred-more:hover{border-color:var(--accent);color:var(--accent)}
  /* 용어 사전: 읽기용 목록이라 카드보다 사전 판형이 낫다. */
  .gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .gterm{background:var(--surface);padding:16px 18px}
  .gterm dt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
  .gterm dt b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .gterm dt em{font-style:normal;font-size:13px;color:var(--muted)}
  .gterm dd{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .searchbox{flex:1 1 260px;min-width:200px;display:flex;align-items:center;gap:10px}
  .searchbox label{font-size:14px;color:var(--muted);white-space:nowrap}
  #search{flex:1;min-height:44px;padding:8px 12px;font-size:15px;font-family:inherit;
    background:var(--surface);color:var(--text);border:1px solid var(--control-border);border-radius:6px}
  #search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab,.tagchip,.btn,.toggle{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
    font-size:14px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text);
    border:1px solid var(--control-border);border-radius:6px;text-decoration:none;transition:border-color .12s,background-color .12s}
  .tab:hover,.tagchip:hover,.btn:hover,.toggle:hover{border-color:var(--accent)}
  .tab[aria-pressed="true"],.tagchip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
  .toggle[aria-expanded="true"]{background:var(--surface2)}
  /* 트랙: 소속과 다른 축. 같은 회사 안에도 현업과 연구가 섞인다. */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
  .filters .flabel{font-size:13px;color:var(--muted);margin-right:2px}
  .filters button{min-height:36px;padding:6px 14px;font-size:13.5px;font-weight:500;cursor:pointer;
    background:var(--surface);color:var(--muted);border:1px solid var(--control-border);border-radius:9999px}
  .filters button:hover{border-color:var(--accent);color:var(--text)}
  .filters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent);font-weight:600}
  .filters button .c{font-variant-numeric:tabular-nums;opacity:.75;margin-left:5px}
  .tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .tagbar .tagchip{font-size:13px}
  .tagbar .tagchip span{color:var(--muted);font-weight:400}
  .count{color:var(--muted);font-size:14px;margin-bottom:12px}

  /* 프로젝트 뷰: 소속 그룹 → 카드 */
  .plist{display:flex;flex-direction:column;gap:16px}
  .ogroup{display:flex;gap:10px;align-items:baseline;margin:40px 0 -4px;font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.5}
  .ogroup:first-child{margin-top:8px}
  .ogroup span{font-size:13px;font-weight:400;color:var(--muted)}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px}
  .phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
  .pname{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.45;margin:0}
  .pperiod{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pmeta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-size:14px;color:var(--muted)}
  .pmeta b{color:var(--text);font-weight:500}
  .headline{margin:16px 0 0;padding:12px 16px;background:var(--surface2);border-left:2px solid var(--border);
    border-radius:4px;font-size:18px;font-weight:600;line-height:1.55;letter-spacing:-.01em}
  .psum{font-size:15px;margin:12px 0 0;max-width:66ch}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chips span{font-size:13px;padding:3px 9px;border-radius:4px;background:var(--surface2);color:var(--muted)}
  .pactions{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .docs{margin-top:16px;border-top:1px solid var(--border);padding-top:6px}
  .docs a{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:10px 0;font-size:15px;
    color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
  .docs a:last-child{border-bottom:none}
  .docs a:hover .t{color:var(--accent);text-decoration:underline}
  .docs .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 문서 뷰: 최대 2열 */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:20px;transition:border-color .12s}
  .card:hover{border-color:var(--accent)}
  .card h2{font-size:18px;font-weight:600;margin:0 0 4px;line-height:1.5;letter-spacing:-.01em}
  .card .group{font-size:13px;color:var(--muted);margin-bottom:8px}
  .card p{font-size:15px;margin:0 0 12px}
  .card-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px}
  .card-tags span{font-size:13px;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--muted)}
  .card .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  .empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:15px;border:1px dashed var(--border);border-radius:8px}
  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
  footer a{font-weight:500}
  [hidden]{display:none!important}
  .booklink{margin:18px 0 0;font-size:15px}
  .booklink a{font-weight:600}
  .booklink span{color:var(--muted);font-size:13px;margin-left:8px}

  @media (max-width:640px){
    .wrap{padding:24px 16px 64px}
    h1{font-size:28px}
    .hero-tag{font-size:18px}
    .hero-metrics{grid-template-columns:1fr}
    .metric .v{font-size:28px}
    .pcard{padding:20px}
    .pname{font-size:20px}
    .phead{flex-direction:column;align-items:flex-start}
    .headline{font-size:17px}
    .grid{grid-template-columns:1fr}
    .docs .d{white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="site-title">아카이브</h1>
    <p class="sub" id="site-sub"></p>
    <section class="hero" id="hero" hidden></section>
  </header>

  <p class="booklink"><a href="study.html">로봇 SW 이론 심화 교재 18장 &rsaquo;</a><span>기구학·제어부터 비전·학습까지. 쉬운 설명, 연습문제, 면접 문항 포함</span></p>
  <div class="modes">
    <button class="mode" type="button" data-mode="projects" aria-pressed="true">프로젝트</button>
    <button class="mode" type="button" data-mode="docs" aria-pressed="false">문서 전체</button>
    <button class="mode" type="button" data-mode="credentials" aria-pressed="false" id="mode-creds" hidden>학력 · 자격 · 교육</button>
    <button class="mode" type="button" data-mode="glossary" aria-pressed="false" id="mode-gloss" hidden>용어 사전</button>
  </div>

  <div class="controls">
    <div class="searchbox">
      <label for="search">검색</label>
      <input id="search" type="search" placeholder="제목, 요약, 태그, 기술" autocomplete="off">
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="toggle" type="button" id="tagtoggle" aria-expanded="false" hidden>기술 태그</button>
  </div>
  <div class="filters" id="trackbar" hidden></div>
  <div class="tagbar" id="tagbar" hidden></div>
  <div class="count" id="count"></div>

  <div class="plist" id="plist"></div>
  <div class="grid" id="grid" hidden></div>
  <div class="creds" id="creds" hidden></div>
  <div class="gloss" id="gloss" hidden></div>

  <footer id="footer"></footer>
</div>

<script src="manifest.js"></script>
<script>
(function () {
  var M = window.ARCHIVE_MANIFEST;
  var plist = document.getElementById('plist');
  var grid = document.getElementById('grid');

  if (!M) {
    plist.innerHTML = '<div class="empty">manifest.js 를 찾지 못했습니다.<br>' +
      '저장소 루트에서 <code>python3 scripts/build_manifest.py</code> 를 실행하세요.</div>';
    return;
  }

  var site = M.site || {};
  var entries = M.entries || [];
  var projects = M.projects || [];
  var creds = document.getElementById('creds');
  var trackbar = document.getElementById('trackbar');
  var gloss = document.getElementById('gloss');
  var GLOSS = (site.glossary && site.glossary.terms) || [];
  // 용어 사전의 한정 문구(정식 정의가 아니라는 안내)를 목록 앞에 보여준다 (Codex 4차 20번).
  var GLOSS_NOTE = (site.glossary && site.glossary.note) || '';
  var CRED = site.credentials || {};
  // groups 는 배열이라 표시 순서가 보존된다. 객체 키였다면 manifest 생성 때 정렬돼 뒤섞인다.
  var CRED_GROUPS = (CRED.groups || []).filter(function (g) {
    return g && g.label && Array.isArray(g.items) && g.items.length;
  });
  var credsOpen = Object.create(null);
  var CRED_FOLD = 8;   // 이보다 많으면 접고 펼치기 버튼을 준다
  var sections = M.sections || [];
  var state = { mode: 'projects', cat: 'all', tag: null, track: null, q: '', tagsOpen: false };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function href(p) { return 'viewer.html?p=' + encodeURIComponent(p); }
  // 연락처 링크는 http(s) 주소만 허용한다. javascript: 같은 스킴은 그리지 않는다.
  function httpUrl(u) {
    u = String(u == null ? '' : u).trim();
    return (u.indexOf('https://') === 0 || u.indexOf('http://') === 0) ? u : '';
  }

  if (site.title) { document.getElementById('site-title').textContent = site.title; document.title = site.title; }
  if (site.subtitle) document.getElementById('site-sub').textContent = site.subtitle;

  // --- 히어로 (site.json 의 hero: tagline, metrics[], contact{}) ---
  (function renderHero() {
    var hero = site.hero;
    var el = document.getElementById('hero');
    if (!hero || typeof hero !== 'object' || !el) return;
    var html = '';
    if (hero.tagline) html += '<p class="hero-tag">' + esc(hero.tagline) + '</p>';
    // 근거가 있는 성과만 최대 2개. 값은 기본 글자색, 측정 조건은 13px 로 바로 아래에.
    var metrics = (hero.metrics || []).filter(function (m) { return m && m.value; }).slice(0, 2);
    if (metrics.length) {
      html += '<div class="hero-metrics">' + metrics.map(function (m) {
        return '<div class="metric"><div class="v">' + esc(m.value) + '</div>' +
               '<div class="l">' + esc(m.label || '') + '</div>' +
               (m.note ? '<div class="n">' + esc(m.note) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    var c = hero.contact || {};
    var foot = [];
    if (httpUrl(c.github)) foot.push('<a href="' + esc(httpUrl(c.github)) + '" rel="noopener">GitHub</a>');
    if (httpUrl(c.linkedin)) foot.push('<a href="' + esc(httpUrl(c.linkedin)) + '" rel="noopener">LinkedIn</a>');
    if (c.email) foot.push('<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>');
    if (foot.length) html += '<div class="hero-foot">' + foot.join('') + '</div>';
    if (!html) return;
    el.innerHTML = html;
    el.hidden = false;
  })();

  // --- 카테고리 탭 (문서 뷰 전용) ---
  var tabs = document.getElementById('tabs');
  var cats = [{ key: 'all', label: '전체' }].concat(
    sections.filter(function (s) {
      return entries.some(function (e) { return e.category === s.key; });
    })
  );
  cats.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.textContent = c.label;
    b.dataset.key = c.key;
    b.onclick = function () { state.cat = c.key; state.tag = null; render(); };
    tabs.appendChild(b);
  });

  // --- 태그 (프로젝트 뷰에서는 기본 접힘) ---
  var tagbar = document.getElementById('tagbar');
  var tagtoggle = document.getElementById('tagtoggle');
  var tagCount = Object.create(null);   // 'constructor' 같은 태그명이 상속 속성과 섞이지 않게
  entries.forEach(function (e) {
    (e.tags || []).concat(e.stack || []).forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  var tagNames = Object.keys(tagCount).sort(function (a, b) { return tagCount[b] - tagCount[a]; }).slice(0, 20);
  tagNames.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'tagchip'; b.type = 'button';
    b.innerHTML = esc(t) + ' <span>' + tagCount[t] + '</span>';
    b.dataset.tag = t;
    b.onclick = function () { state.tag = (state.tag === t) ? null : t; render(); };
    tagbar.appendChild(b);
  });
  tagtoggle.onclick = function () { state.tagsOpen = !state.tagsOpen; render(); };

  document.getElementById('search').oninput = function (ev) {
    state.q = ev.target.value.trim().toLowerCase(); render();
  };
  // 트랙 필터. site.json 의 org_order 처럼 순서를 고정한다.
  var TRACK_ORDER = ['현업', '연구', '교육', '학부'];
  var trackCount = Object.create(null);
  projects.forEach(function (p) { if (p.track) trackCount[p.track] = (trackCount[p.track] || 0) + 1; });
  var trackNames = TRACK_ORDER.filter(function (t) { return trackCount[t]; })
    .concat(Object.keys(trackCount).filter(function (t) { return TRACK_ORDER.indexOf(t) < 0; }).sort());
  if (trackNames.length > 1) {
    var lab = document.createElement('span');
    lab.className = 'flabel'; lab.textContent = '구분';
    trackbar.append(lab);
    [['', '전체', projects.length]].concat(trackNames.map(function (t) { return [t, t, trackCount[t]]; }))
      .forEach(function (row) {
        var b = document.createElement('button');
        b.type = 'button'; b.dataset.track = row[0];
        b.innerHTML = esc(row[1]) + '<span class="c">' + row[2] + '</span>';
        b.setAttribute('aria-pressed', String(row[0] === ''));
        b.onclick = function () { state.track = row[0] || null; render(); };
        trackbar.append(b);
      });
  }

  // credentials 가 site.json 에 없으면 탭 자체를 두지 않는다.
  document.getElementById('mode-creds').hidden = CRED_GROUPS.length === 0;
  document.getElementById('mode-gloss').hidden = GLOSS.length === 0;
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
    b.onclick = function () { state.mode = b.dataset.mode; state.cat = 'all'; render(); };
  });

  function hay(o, extra) {
    return [o.title || o.name, o.summary, o.role, o.headline, o.group, o.org,
            (o.tags || []).join(' '), (o.stack || []).join(' '), extra || '']
      .join(' ').toLowerCase();
  }
  function matchDoc(e) {
    if (state.cat !== 'all' && e.category !== state.cat) return false;
    if (state.tag && (e.tags || []).concat(e.stack || []).indexOf(state.tag) === -1) return false;
    if (state.q && hay(e, e.project).indexOf(state.q) === -1) return false;
    return true;
  }
  function matchProject(p) {
    if (state.track && p.track !== state.track) return false;
    if (state.tag && (p.tags || []).concat(p.stack || []).indexOf(state.tag) === -1) return false;
    if (state.q) {
      var docText = (p.docs || []).map(function (d) { return d.title; }).join(' ');
      if (hay(p, docText).indexOf(state.q) === -1) return false;
    }
    return true;
  }

  // 카드: 제목·기간 → 역할·단계 → 성과 → 요약 → 기술 → 사례 읽기 → 관련 문서
  function projectCard(p, i, grouped) {
    var meta = [];
    if (p.org && !grouped) meta.push('<span><b>소속</b> ' + esc(p.org) + '</span>');
    if (p.role) meta.push('<span><b>역할</b> ' + esc(p.role) + '</span>');
    if (p.stage) meta.push('<span><b>단계</b> ' + esc(p.stage) + '</span>');
    meta.push('<span><b>문서</b> ' + esc(p.doc_count) + '건</span>');

    var chips = (p.stack || []).concat(p.tags || []).filter(function (v, j, a) { return a.indexOf(v) === j; })
      .map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');

    var docs = (p.docs || []).map(function (d) {
      return '<a href="' + href(d.path) + '"><span class="t">' + esc(d.title) + '</span>' +
             '<span class="d">' + esc(d.category_label) + ' · ' + esc(d.date) + '</span></a>';
    }).join('');

    return '<div class="pcard">' +
      '<div class="phead"><h2 class="pname">' + esc(p.name) + '</h2>' +
        '<span class="pperiod">' + esc(p.period || '') + '</span></div>' +
      '<div class="pmeta">' + meta.join('') + '</div>' +
      (p.headline ? '<div class="headline">' + esc(p.headline) + '</div>' : '') +
      (p.summary ? '<p class="psum">' + esc(p.summary) + '</p>' : '') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      '<div class="pactions">' +
        (p.main ? '<a class="btn primary" href="' + href(p.main) + '">사례 읽기</a>' : '') +
        (docs ? '<button class="btn" type="button" data-toggle="' + i + '" aria-expanded="false">관련 문서 ' + (p.docs || []).length + '건 보기</button>' : '') +
      '</div>' +
      (docs ? '<div class="docs" id="docs-' + i + '" hidden>' + docs + '</div>' : '') +
    '</div>';
  }

  function credRow(it) {
    var when = it.date || it.period || '';
    var name = esc(it.name || '');
    if (it.project) name = '<a href="' + href(it.project) + '">' + name + '</a>';
    return '<li>' +
      '<span class="cred-name">' + name + '</span>' +
      (it.org ? '<span class="cred-org">' + esc(it.org) + '</span>' : '') +
      (it.hours ? '<span class="cred-org">' + esc(it.hours) + '</span>' : '') +
      (when ? '<span class="cred-when">' + esc(when) + '</span>' : '') +
      (it.detail ? '<span class="cred-detail">' + esc(it.detail) + '</span>' : '') +
      '</li>';
  }

  function renderCredentials() {
    var html = CRED.note ? '<p class="cred-note">' + esc(CRED.note) + '</p>' : '';
    html += CRED_GROUPS.map(function (g) {
      var k = g.label, items = g.items;
      var open = credsOpen[k] || items.length <= CRED_FOLD;
      var shown = open ? items : items.slice(0, CRED_FOLD);
      return '<section>' +
        '<h3>' + esc(k) + '<span>' + items.length + '건</span></h3>' +
        '<ul class="cred-list">' + shown.map(credRow).join('') + '</ul>' +
        (items.length > CRED_FOLD
          ? '<button class="cred-more" type="button" data-cred="' + esc(k) + '" aria-expanded="' + open + '">' +
            (open ? '접기' : '나머지 ' + (items.length - CRED_FOLD) + '건 더 보기') + '</button>'
          : '') +
        '</section>';
    }).join('');
    creds.innerHTML = html;
    Array.prototype.forEach.call(creds.querySelectorAll('[data-cred]'), function (b) {
      b.onclick = function () { credsOpen[b.dataset.cred] = !credsOpen[b.dataset.cred]; render(); };
    });
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode);
    });
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.key === state.cat);
    });
    Array.prototype.forEach.call(tagbar.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.tag === state.tag);
    });
    tabs.hidden = state.mode !== 'docs';

    var isCred = state.mode === 'credentials';
    var isGloss = state.mode === 'glossary';
    var showTags = !isCred && !isGloss && tagNames.length > 0 && (state.mode === 'docs' || state.tagsOpen || !!state.tag);
    tagbar.hidden = !showTags;
    tagtoggle.hidden = state.mode !== 'projects' || tagNames.length === 0;
    tagtoggle.setAttribute('aria-expanded', String(showTags));
    tagtoggle.textContent = (showTags ? '기술 태그 접기' : '기술 태그 보기') + ' (' + tagNames.length + ')';
    // 학력·자격·교육은 목록이 짧고 고정이라 검색·태그 필터를 걸지 않는다.
    document.querySelector('.controls').hidden = isCred || isGloss;
    trackbar.hidden = state.mode !== 'projects' || trackbar.childElementCount === 0;
    Array.prototype.forEach.call(trackbar.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.track || null) === (state.track || null)));
    });
    creds.hidden = !isCred;
    gloss.hidden = !isGloss;

    if (isGloss) {
      plist.hidden = true; grid.hidden = true;
      document.getElementById('count').textContent = '용어 ' + GLOSS.length + '개';
      gloss.innerHTML = (GLOSS_NOTE ? '<p class="cred-note">' + esc(GLOSS_NOTE) + '</p>' : '') +
        GLOSS.map(function (t) {
        return '<dl class="gterm"><dt><b>' + esc(t.t) + '</b>' +
          (t.e ? '<em>' + esc(t.e) + '</em>' : '') + '</dt>' +
          '<dd>' + esc(t.d) + '</dd></dl>';
      }).join('');
    } else if (isCred) {
      plist.hidden = true; grid.hidden = true;
      var total = CRED_GROUPS.reduce(function (n, g) { return n + g.items.length; }, 0);
      document.getElementById('count').textContent = '항목 ' + total + '건';
      renderCredentials();
    } else if (state.mode === 'projects') {
      grid.hidden = true; plist.hidden = false;
      var list = projects.filter(matchProject);
      document.getElementById('count').textContent =
        '프로젝트 ' + list.length + '건' + (list.length !== projects.length ? ' / 전체 ' + projects.length + '건' : '');
      if (!list.length) {
        plist.innerHTML = '<div class="empty">프로젝트가 없습니다. 문서 앞머리에 <code>project: 이름</code> 을 넣으면 여기에 묶입니다.</div>';
      } else if (list.some(function (p) { return p.org; })) {
        // 소속(org)별로 묶는다. 순서는 최근 활동순(이미 정렬됨)에서 처음 나온 소속 순.
        var groups = [], seen = Object.create(null);
        list.forEach(function (p) {
          var k = p.org || '기타';
          if (!seen[k]) { seen[k] = { org: k, items: [] }; groups.push(seen[k]); }
          seen[k].items.push(p);
        });
        plist.innerHTML = groups.map(function (g) {
          return '<h3 class="ogroup">' + esc(g.org) + ' <span>프로젝트 ' + g.items.length + '건</span></h3>' +
                 g.items.map(function (p) { return projectCard(p, projects.indexOf(p), true); }).join('');
        }).join('');
      } else {
        plist.innerHTML = list.map(function (p) { return projectCard(p, projects.indexOf(p), false); }).join('');
      }
      Array.prototype.forEach.call(plist.querySelectorAll('[data-toggle]'), function (b) {
        b.onclick = function () {
          var el = document.getElementById('docs-' + b.dataset.toggle);
          el.hidden = !el.hidden;
          b.setAttribute('aria-expanded', String(!el.hidden));
          b.textContent = el.hidden ? b.textContent.replace('접기', '보기') : b.textContent.replace('보기', '접기');
        };
      });
    } else {
      plist.hidden = true; grid.hidden = false;
      var docs = entries.filter(matchDoc);
      document.getElementById('count').textContent =
        '문서 ' + docs.length + '건' + (docs.length !== entries.length ? ' / 전체 ' + entries.length + '건' : '');
      grid.innerHTML = docs.length ? docs.map(function (e) {
        var ctx = [e.org, e.project].filter(Boolean).join(' · ');
        return '<a class="card" href="' + href(e.path) + '">' +
          '<h2>' + esc(e.title) + '</h2>' +
          (ctx ? '<div class="group">' + esc(ctx) + '</div>' : '') +
          '<p>' + esc(e.summary) + '</p>' +
          '<div class="card-foot">' +
            '<div class="card-tags">' + (e.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
            '<span class="meta">' + esc(e.category_label) + ' · ' + esc(e.date) + '</span>' +
          '</div></a>';
      }).join('') : '<div class="empty">조건에 맞는 문서가 없습니다.</div>';
    }
  }

  // 푸터: 저장소 종류, 건수, 최근 문서 날짜, 연락처 반복
  (function renderFooter() {
    var parts = [];
    if (site.visibility) parts.push(site.visibility === 'private' ? '비공개 저장소' : '공개 저장소');
    parts.push('프로젝트 ' + projects.length + '건 · 문서 ' + entries.length + '건');
    parts.push('<a href="study.html">이론 심화 교재 18장</a>');
    if (site.updated) parts.push('최근 문서 ' + esc(site.updated));
    var c = (site.hero && site.hero.contact) || {};
    if (httpUrl(c.github)) parts.push('<a href="' + esc(httpUrl(c.github)) + '" rel="noopener">GitHub</a>');
    if (c.email) parts.push('<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>');
    document.getElementById('footer').innerHTML = parts.map(function (p) { return '<span>' + p + '</span>'; }).join('');
  })();

  render();
})();
</script>
</body>
</html>
