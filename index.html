<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아카이브</title>
<style>
  :root {
    --bg:#f7f7f5; --surface:#fff; --surface2:#fbfbfa; --border:#e3e2dd;
    --text:#1c1b19; --muted:#6f6d67; --accent:#b05730; --accent-soft:#f3e6df;
    --shadow:0 1px 2px rgba(28,27,25,.05),0 4px 12px rgba(28,27,25,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#191816; --surface:#232220; --surface2:#1f1e1c; --border:#35332f;
      --text:#ecebe7; --muted:#9b978e; --accent:#e08b5f; --accent-soft:#33261f; --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.65;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:48px 24px 96px}
  header{margin-bottom:8px}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .badge{display:inline-block;margin-top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
  .badge.private{background:var(--accent-soft);color:var(--accent)}
  .badge.public{background:transparent;color:var(--muted);border:1px solid var(--border)}

  .modes{display:flex;gap:4px;margin:28px 0 18px;border-bottom:1px solid var(--border)}
  .mode{padding:10px 18px;font-size:14px;font-family:inherit;cursor:pointer;background:none;border:none;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .mode[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  #search{flex:1 1 240px;min-width:200px;padding:10px 14px;font-size:14px;font-family:inherit;
    background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px}
  #search:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;background:none;
    color:var(--muted);border:1px solid var(--border);border-radius:999px}
  .tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
  .tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .tagchip{font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;background:none;
    color:var(--muted);border:1px dashed var(--border);font-family:inherit}
  .tagchip[aria-pressed="true"]{background:var(--accent);color:#fff;border-style:solid;border-color:var(--accent)}
  .count{color:var(--muted);font-size:13px;margin-bottom:14px}

  /* 프로젝트 뷰 */
  .plist{display:flex;flex-direction:column;gap:16px}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:22px 24px;box-shadow:var(--shadow)}
  .phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
  .pname{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  .pperiod{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pmeta{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0;font-size:13px;color:var(--muted)}
  .pmeta b{color:var(--text);font-weight:600}
  .headline{margin:14px 0 0;padding:10px 14px;background:var(--accent-soft);color:var(--accent);
    border-radius:8px;font-size:14px;font-weight:600}
  .psum{font-size:14px;color:var(--text);margin:12px 0 0}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .chips span{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--surface2);
    border:1px solid var(--border);color:var(--muted)}
  .pactions{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{font-size:13px;font-family:inherit;padding:6px 13px;border-radius:7px;cursor:pointer;
    background:none;border:1px solid var(--border);color:var(--muted);text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .docs{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  .docs a{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;
    color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
  .docs a:last-child{border-bottom:none}
  .docs a:hover{color:var(--accent)}
  .docs .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 문서 뷰 */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{display:block;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);
    transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .cat{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em}
  .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card h2{font-size:16px;margin:0 0 8px;line-height:1.4;letter-spacing:-.01em}
  .card p{font-size:13px;color:var(--muted);margin:0 0 12px}
  .group{font-size:11px;color:var(--muted)}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px}
  .card-tags span{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

  .empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;
    border:1px dashed var(--border);border-radius:12px}
  footer{margin-top:48px;font-size:12px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="site-title">아카이브</h1>
    <p class="sub" id="site-sub"></p>
    <div id="vis-badge"></div>
  </header>

  <div class="modes">
    <button class="mode" type="button" data-mode="projects" aria-pressed="true">프로젝트</button>
    <button class="mode" type="button" data-mode="docs" aria-pressed="false">문서 전체</button>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="제목, 요약, 태그, 기술로 검색" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="tagbar" id="tagbar"></div>
  <div class="count" id="count"></div>

  <div class="plist" id="plist"></div>
  <div class="grid" id="grid" hidden></div>

  <footer id="footer"></footer>
</div>

<script src="manifest.js"></script>
<script>
(function () {
  var M = window.ARCHIVE_MANIFEST;
  var plist = document.getElementById('plist');
  var grid = document.getElementById('grid');

  if (!M) {
    plist.innerHTML = '<div class="empty">manifest.js 를 찾지 못했습니다.<br>' +
      '저장소 루트에서 <code>python3 scripts/build_manifest.py</code> 를 실행하세요.</div>';
    return;
  }

  var site = M.site || {};
  var entries = M.entries || [];
  var projects = M.projects || [];
  var sections = M.sections || [];
  var state = { mode: 'projects', cat: 'all', tag: null, q: '' };

  if (site.title) { document.getElementById('site-title').textContent = site.title; document.title = site.title; }
  if (site.subtitle) document.getElementById('site-sub').textContent = site.subtitle;
  if (site.visibility) {
    var priv = site.visibility === 'private';
    document.getElementById('vis-badge').innerHTML =
      '<span class="badge ' + (priv ? 'private' : 'public') + '">' +
      (priv ? '비공개 저장소' : '공개 저장소') + '</span>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function href(p) { return 'viewer.html?p=' + encodeURIComponent(p); }

  // --- 카테고리 탭 (문서 뷰 전용) ---
  var tabs = document.getElementById('tabs');
  var cats = [{ key: 'all', label: '전체' }].concat(
    sections.filter(function (s) {
      return entries.some(function (e) { return e.category === s.key; });
    })
  );
  cats.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.textContent = c.label;
    b.dataset.key = c.key;
    b.onclick = function () { state.cat = c.key; state.tag = null; render(); };
    tabs.appendChild(b);
  });

  // --- 태그 ---
  var tagbar = document.getElementById('tagbar');
  var tagCount = {};
  entries.forEach(function (e) {
    (e.tags || []).concat(e.stack || []).forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  Object.keys(tagCount).sort(function (a, b) { return tagCount[b] - tagCount[a]; })
    .slice(0, 20).forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'tagchip'; b.type = 'button'; b.textContent = t + ' ' + tagCount[t];
      b.dataset.tag = t;
      b.onclick = function () { state.tag = (state.tag === t) ? null : t; render(); };
      tagbar.appendChild(b);
    });

  document.getElementById('search').oninput = function (ev) {
    state.q = ev.target.value.trim().toLowerCase(); render();
  };
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
    b.onclick = function () { state.mode = b.dataset.mode; state.cat = 'all'; render(); };
  });

  function hay(o, extra) {
    return [o.title || o.name, o.summary, o.role, o.headline, o.group,
            (o.tags || []).join(' '), (o.stack || []).join(' '), extra || '']
      .join(' ').toLowerCase();
  }
  function matchDoc(e) {
    if (state.cat !== 'all' && e.category !== state.cat) return false;
    if (state.tag && (e.tags || []).concat(e.stack || []).indexOf(state.tag) === -1) return false;
    if (state.q && hay(e, e.project).indexOf(state.q) === -1) return false;
    return true;
  }
  function matchProject(p) {
    if (state.tag && (p.tags || []).concat(p.stack || []).indexOf(state.tag) === -1) return false;
    if (state.q) {
      var docText = (p.docs || []).map(function (d) { return d.title; }).join(' ');
      if (hay(p, docText).indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function projectCard(p, i) {
    var meta = [];
    if (p.role) meta.push('<span><b>역할</b> ' + esc(p.role) + '</span>');
    if (p.stage) meta.push('<span><b>단계</b> ' + esc(p.stage) + '</span>');
    meta.push('<span><b>문서</b> ' + p.doc_count + '건</span>');

    var chips = (p.stack || []).concat(p.tags || []).filter(function (v, j, a) { return a.indexOf(v) === j; })
      .map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');

    var docs = (p.docs || []).map(function (d) {
      return '<a href="' + href(d.path) + '"><span>' + esc(d.title) + '</span>' +
             '<span class="d">' + esc(d.category_label) + ' · ' + esc(d.date) + '</span></a>';
    }).join('');

    return '<div class="pcard">' +
projectHead(p) +
      '<div class="pmeta">' + meta.join('') + '</div>' +
      (p.headline ? '<div class="headline">' + esc(p.headline) + '</div>' : '') +
      (p.summary ? '<p class="psum">' + esc(p.summary) + '</p>' : '') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      '<div class="pactions">' +
        (p.main ? '<a class="btn primary" href="' + href(p.main) + '">프로젝트 문서 열기</a>' : '') +
        (docs ? '<button class="btn" type="button" data-toggle="' + i + '">관련 문서 ' + (p.docs || []).length + '건 보기</button>' : '') +
      '</div>' +
      (docs ? '<div class="docs" id="docs-' + i + '" hidden>' + docs + '</div>' : '') +
    '</div>';
  }
  function projectHead(p) {
    return '<div class="phead"><h2 class="pname">' + esc(p.name) + '</h2>' +
           '<span class="pperiod">' + esc(p.period || '') + '</span></div>';
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode);
    });
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.key === state.cat);
    });
    Array.prototype.forEach.call(tagbar.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.tag === state.tag);
    });
    tabs.hidden = state.mode !== 'docs';

    if (state.mode === 'projects') {
      grid.hidden = true; plist.hidden = false;
      var list = projects.filter(matchProject);
      document.getElementById('count').textContent =
        '프로젝트 ' + list.length + '건' + (list.length !== projects.length ? ' / 전체 ' + projects.length + '건' : '');
      plist.innerHTML = list.length
        ? list.map(projectCard).join('')
        : '<div class="empty">프로젝트가 없습니다. 문서 앞머리에 <code>project: 이름</code> 을 넣으면 여기에 묶입니다.</div>';
      Array.prototype.forEach.call(plist.querySelectorAll('[data-toggle]'), function (b) {
        b.onclick = function () {
          var el = document.getElementById('docs-' + b.dataset.toggle);
          el.hidden = !el.hidden;
          b.textContent = el.hidden ? b.textContent.replace('접기', '보기') : b.textContent.replace('보기', '접기');
        };
      });
    } else {
      plist.hidden = true; grid.hidden = false;
      var docs = entries.filter(matchDoc);
      document.getElementById('count').textContent =
        docs.length + '건' + (docs.length !== entries.length ? ' / 전체 ' + entries.length + '건' : '');
      grid.innerHTML = docs.length ? docs.map(function (e) {
        return '<a class="card" href="' + href(e.path) + '">' +
          '<div class="card-top"><span class="cat">' + esc(e.category_label) + '</span>' +
          '<span class="date">' + esc(e.date) + '</span></div>' +
          '<h2>' + esc(e.title) + '</h2>' +
          (e.project ? '<div class="group">' + esc(e.project) + '</div>' : '') +
          '<p>' + esc(e.summary) + '</p>' +
          '<div class="card-tags">' + (e.tags || []).map(function (t) {
            return '<span>' + esc(t) + '</span>'; }).join('') + '</div></a>';
      }).join('') : '<div class="empty">조건에 맞는 문서가 없습니다.</div>';
    }
  }

  document.getElementById('footer').textContent =
    '프로젝트 ' + projects.length + '건 · 문서 ' + entries.length + '건';
  render();
})();
</script>
</body>
</html>
