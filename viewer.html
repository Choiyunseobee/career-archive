<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 보기</title>
<style>
  :root{--bg:#f7f7f5;--surface:#fff;--border:#e3e2dd;--text:#1c1b19;--muted:#6f6d67;
    --accent:#b05730;--accent-soft:#f3e6df}
  @media (prefers-color-scheme:dark){:root{--bg:#191816;--surface:#232220;--border:#35332f;
    --text:#ecebe7;--muted:#9b978e;--accent:#e08b5f;--accent-soft:#33261f}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:32px 24px 96px}
  .back{display:inline-block;margin-bottom:24px;font-size:13px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--accent)}
  .meta{font-size:12px;color:var(--muted);margin-bottom:20px;font-variant-numeric:tabular-nums}
  article{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 40px}
  article h1{font-size:26px;letter-spacing:-.02em;margin:0 0 20px}
  article h2{font-size:19px;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  article h3{font-size:16px;margin:26px 0 8px}
  article p,article li{font-size:15px}
  article code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;
    background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px}
  article pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto}
  article pre code{background:none;color:var(--text);padding:0}
  article table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--border);padding:8px 12px;text-align:left}
  article th{background:var(--bg);font-weight:600}
  article blockquote{margin:16px 0;padding:4px 18px;border-left:3px solid var(--accent);color:var(--muted)}
  article img{max-width:100%;border-radius:8px}
  article a{color:var(--accent)}
  .fallback{font-size:14px;color:var(--muted)}
  .raw{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 목록으로</a>
  <div class="meta" id="meta"></div>
  <article id="doc"><p class="fallback">불러오는 중…</p></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="manifest.js"></script>
<script>
(function () {
  var doc = document.getElementById('doc');
  var meta = document.getElementById('meta');
  var path = new URLSearchParams(location.search).get('p');
  var M = window.ARCHIVE_MANIFEST || {};

  function fail(msg) {
    doc.textContent = '';
    var p = document.createElement('p');
    p.className = 'fallback';
    p.textContent = msg;
    doc.appendChild(p);
  }

  // 목록(manifest)에 있는 문서만 연다. 외부 주소나 상위 경로는 아예 시도하지 않는다.
  var entry = null;
  if (path) {
    var all = (M.entries || []);
    for (var i = 0; i < all.length; i++) { if (all[i].path === path) { entry = all[i]; break; } }
  }
  if (!entry) {
    fail('목록에 없는 문서입니다. 목록에서 다시 선택해 주세요.');
  } else {
    document.title = entry.title;
    meta.textContent = [entry.category_label, entry.date, entry.project].filter(Boolean).join('  ·  ');

    fetch(entry.path)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        var body = text.replace(/^---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*\r?\n/, '');
        if (window.marked) {
          marked.setOptions({ breaks: true, gfm: true });
          var html = marked.parse(body);
          doc.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
          if (!window.DOMPurify) {
            // 위생 처리 라이브러리를 못 불러온 경우, 원문 그대로만 보여준다.
            doc.textContent = '';
            var pre = document.createElement('div');
            pre.className = 'raw'; pre.textContent = body;
            doc.appendChild(pre);
          }
        } else {
          doc.textContent = '';
          var d = document.createElement('div');
          d.className = 'raw'; d.textContent = body;
          doc.appendChild(d);
        }
      })
      .catch(function () {
        doc.textContent = '';
        var p = document.createElement('p');
        p.className = 'fallback';
        p.textContent = '문서를 불러오지 못했습니다. GitHub Pages 에서는 정상 동작합니다. ' +
          '로컬에서 볼 때는 이 폴더에서 python3 -m http.server 8000 을 실행한 뒤 ' +
          'http://localhost:8000 으로 여세요. 원본 파일: ';
        var a = document.createElement('a');
        a.href = entry.path; a.textContent = entry.path;
        p.appendChild(a);
        doc.appendChild(p);
      });
  }
})();
</script>
</body>
</html>
